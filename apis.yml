name: Alterego
description: >-
  Alterego is a Boston-based startup, spun out of the MIT Media Lab in 2025,
  building a near-telepathic silent-speech interface: a minimal, non-invasive
  wearable that detects the faint neuromuscular signals produced when a person
  internally verbalizes words, letting them interact with AI and computers
  without typing, tapping, or speaking aloud. Its "Silent Sense" technology
  responds only to intentional internal speech, keeping private thoughts private
  while enabling hands-free, screen-free messaging, queries, and information
  access. The company is pre-launch, backed by investors including Canaan,
  Granite Ventures, Mayfield, Rembrandt Venture Partners, and Cisco Investments.
  As of this profile Alterego publishes no public API or developer platform.
